spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mednet-api
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    connect-retries: 10
    connect-retries-interval: 2s
  session:
    jdbc:
      initialize-schema: never

mednet:
  notifications:
    email:
      enabled: ${MEDNET_EMAIL_NOTIFICATIONS_ENABLED:true}
      initial-delay: ${MEDNET_EMAIL_DISPATCH_INITIAL_DELAY:PT10S}
      dispatch-interval: ${MEDNET_EMAIL_DISPATCH_INTERVAL:PT15S}
      web-base-url: ${MEDNET_WEB_BASE_URL:http://localhost:3000}
  admin:
    email: ${MEDNET_ADMIN_EMAIL:}
    password: ${MEDNET_ADMIN_PASSWORD:}
  session:
    # Signed-in sessions end this long after sign-in even when active (0 disables).
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
  rate-limit:
    enabled: ${MEDNET_RATE_LIMIT_ENABLED:true}
    # Reverse proxies (addresses or CIDR ranges) whose X-Forwarded-For identifies the client.
    trusted-proxies: ${MEDNET_TRUSTED_PROXIES:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    url: /api-docs/
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      # Idle timeout: a session unused for this long ends.
      timeout: ${SESSION_IDLE_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
