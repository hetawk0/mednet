spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mednet-api
  jpa:
    open-in-view: false

mednet:
  admin:
    email: ${MEDNET_ADMIN_EMAIL:}
    password: ${MEDNET_ADMIN_PASSWORD:}
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
