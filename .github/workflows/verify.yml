name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn verify

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated non-superuser test database
        run: |
          database_password="$(openssl rand -hex 32)"
          echo "::add-mask::$database_password"
          psql "postgresql://postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE mednet_ci LOGIN PASSWORD '${database_password}'"
          psql "postgresql://postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE mednet_ci_test OWNER mednet_ci"
          {
            echo "MEDNET_TEST_DATABASE_URL=jdbc:postgresql://localhost:5432/mednet_ci_test"
            echo "MEDNET_TEST_DATABASE_USERNAME=mednet_ci"
            echo "MEDNET_TEST_DATABASE_PASSWORD=${database_password}"
          } >> "$GITHUB_ENV"
      - name: Run PostgreSQL integration and workflow tests
        run: mvn -Ppostgres-it verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
